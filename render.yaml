  # ── Weekly report cron ───────────────────────────────────────────
  - type: cron
    name: buildmind-weekly-report
    runtime: node
    plan: free
    schedule: "0 7 * * 5"   # 7:00 AM UTC every Friday
    buildCommand: echo "No build needed"
    startCommand: >
      node -e "
      const https = require('https');
      const url = new URL(process.env.APP_URL + '/api/ai/weekly-report');
      const options = {
        hostname: url.hostname,
        port: 443,
        path: url.pathname,
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-cron-secret': process.env.CRON_SECRET
        }
      };
      const req = https.request(options, res => {
        let body = '';
        res.on('data', d => body += d);
        res.on('end', () => {
          console.log('[BuildMind Weekly] Status:', res.statusCode);
          console.log('[BuildMind Weekly] Response:', body);
          process.exit(res.statusCode === 200 ? 0 : 1);
        });
      });
      req.on('error', e => {
        console.error('[BuildMind Weekly] Error:', e.message);
        process.exit(1);
      });
      req.end();
      "
    envVars:
      - key: APP_URL
        value: https://buildmind.live
      - key: CRON_SECRET
        sync: false
