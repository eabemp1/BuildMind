# ═══════════════════════════════════════════════════════════════════
#  render.yaml — BuildMind infrastructure on Render (FREE TIER)
#
#  WHY RENDER INSTEAD OF VERCEL CRONS:
#  Vercel cron jobs require a Pro plan ($20/mo).
#  Render's free tier includes cron jobs at no cost.
#
#  Setup:
#  1. Push this repo to GitHub
#  2. Connect to Render → New → Blueprint
#  3. Set these env vars in Render dashboard:
#     APP_URL=https://buildmind.live
#     CRON_SECRET=<same value as your Next.js CRON_SECRET>
#
#  The cron calls /api/push/send-daily on your Next.js app daily at 6am UTC.
# ═══════════════════════════════════════════════════════════════════

