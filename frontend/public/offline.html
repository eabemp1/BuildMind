<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BuildMind — Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0f;
      color: #f0f2f8;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 380px;
      text-align: center;
    }
    .logo {
      margin-bottom: 24px;
    }
    h1 { font-size: 20px; font-weight: 500; margin-bottom: 8px; }
    p { font-size: 14px; color: #6b7a99; line-height: 1.6; margin-bottom: 20px; }
    .tip {
      background: rgba(139,131,232,.08);
      border: 1px solid rgba(139,131,232,.2);
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 12px;
      color: #a0aec0;
      text-align: left;
    }
    .tip strong { color: #f0f2f8; font-weight: 500; display: block; margin-bottom: 4px; }
    button {
      margin-top: 20px;
      background: rgba(139,131,232,.18);
      color: #8b83e8;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover { background: rgba(139,131,232,.28); }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="48" height="48">
        <rect width="32" height="32" rx="7" fill="#14141c"/>
        <circle cx="6" cy="9" r="1.6" fill="#4F46E5" opacity=".75"/>
        <circle cx="6" cy="16" r="1.6" fill="#4F46E5" opacity=".75"/>
        <circle cx="6" cy="23" r="1.6" fill="#4F46E5" opacity=".75"/>
        <circle cx="16" cy="7" r="1.6" fill="#7C3AED" opacity=".8"/>
        <circle cx="16" cy="14" r="1.6" fill="#7C3AED" opacity=".8"/>
        <circle cx="16" cy="21" r="1.6" fill="#7C3AED" opacity=".8"/>
        <circle cx="26" cy="9" r="1.6" fill="#A78BFA" opacity=".75"/>
        <circle cx="26" cy="16" r="1.6" fill="#A78BFA" opacity=".75"/>
        <circle cx="26" cy="23" r="1.6" fill="#A78BFA" opacity=".75"/>
        <line x1="7.6" y1="16" x2="14.4" y2="14" stroke="#6D28D9" stroke-width="1" opacity=".95"/>
        <line x1="17.6" y1="14" x2="24.4" y2="16" stroke="#8B5CF6" stroke-width="1" opacity=".95"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>BuildMind needs a connection to load your today's action. But your progress is safe.</p>
    <div class="tip">
      <strong>While you're offline:</strong>
      Think about yesterday's action. Did you do it? What happened? When you're back online, log it in Reflect — that's where the real learning happens.
    </div>
    <button onclick="window.location.reload()">Try again</button>
  </div>
</body>
</html>
