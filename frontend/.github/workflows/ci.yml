name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Unit tests ────────────────────────────────────────────────────
  # Runs on every push. No Supabase needed — pure function tests only.
  unit:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # ── Job 2: Type check ────────────────────────────────────────────────────
  # Catches TypeScript errors without a full build.
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

  # ── Job 3: E2E tests ─────────────────────────────────────────────────────
  # Runs only on PRs to main (more expensive — spins up full Next.js server).
  # Requires secrets configured in GitHub → Settings → Secrets and variables.
  #
  # Required secrets:
  #   NEXT_PUBLIC_SUPABASE_URL        — your Supabase project URL
  #   NEXT_PUBLIC_SUPABASE_ANON_KEY   — Supabase anon key
  #   SUPABASE_SERVICE_ROLE_KEY       — Supabase service role key
  #   E2E_TEST_EMAIL                  — test account email
  #   E2E_TEST_PASSWORD               — test account password
  #
  # Optional secrets (AI features degraded but tests still pass):
  #   GROQ_API_KEY                    — Groq key (tests mock AI routes)
  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [unit, typecheck]
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL:      ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY:     ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GROQ_API_KEY:                  ${{ secrets.GROQ_API_KEY }}
      E2E_TEST_EMAIL:                ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD:             ${{ secrets.E2E_TEST_PASSWORD }}
      PLAYWRIGHT_BASE_URL:           http://localhost:3000
      CI:                            true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build Next.js app
        run: npm run build
        env:
          # Build-time env vars (NEXT_PUBLIC_* must be present at build time)
          NEXT_PUBLIC_SUPABASE_URL:      ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Start Next.js server
        run: npm start &
        env:
          PORT: 3000

      - name: Wait for server to be ready
        run: npx wait-on http://localhost:3000 --timeout 30000

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-screenshots
          path: test-results/
          retention-days: 7
