name: Backend CI

on:
  push:
    branches: ["main", "develop"]
    paths:
      - "app/**"
      - "tests/**"
      - "requirements.txt"
      - "alembic.ini"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "app/**"
      - "tests/**"
      - "requirements.txt"

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations (SQLite test DB)
        env:
          DATABASE_URL: sqlite:///./ci_test.db
        run: alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: sqlite:///./ci_test.db
          SECRET_KEY: ci-test-secret-not-for-prod
          JWT_SECRET: ci-test-jwt-secret-not-for-prod
          GROQ_API_KEY: ""
        run: pytest tests/ -v --tb=short

      - name: Cleanup test DB
        if: always()
        run: rm -f ci_test.db

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check app/ tests/ --select E,F,W,I --ignore E501
